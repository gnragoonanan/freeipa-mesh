{{- if not .Values.auth.existingSecret }}
{{/*
Created only when no existing Secret was supplied. Note that passwords set
through values end up in the Helm release Secret as well, which is why
auth.existingSecret is the recommended path for production.

The `required` calls mean an install with no password fails immediately rather
than standing up an identity server with an empty or defaulted credential.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freeipa.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "freeipa.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.adminPasswordKey }}: {{ required "auth.adminPassword is required unless auth.existingSecret is set" .Values.auth.adminPassword | quote }}
  {{ .Values.auth.dmPasswordKey }}: {{ required "auth.dmPassword is required unless auth.existingSecret is set" .Values.auth.dmPassword | quote }}
{{- end }}
