<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="freeipa-mesh banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="0.6" stop-color="#112031"/>
      <stop offset="1" stop-color="#18304a"/>
    </linearGradient>
    <!-- userSpaceOnUse: vertical/horizontal segments have a zero-area bbox, which
         makes an objectBoundingBox gradient degenerate and the stroke invisible. -->
    <linearGradient id="bamber" gradientUnits="userSpaceOnUse" x1="900" y1="180" x2="1120" y2="460">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#f6a623"/>
      <stop offset="1" stop-color="#e2761b"/>
    </linearGradient>
    <radialGradient id="bhub" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.6" stop-color="#f6a623"/>
      <stop offset="1" stop-color="#df7117"/>
    </radialGradient>
    <filter id="bglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bbg)"/>
  <circle cx="1012" cy="320" r="230" fill="#f6a623" opacity="0.07"/>

  <!-- replication spokes -->
  <g stroke="url(#bamber)" stroke-width="6" stroke-linecap="round" opacity="0.4">
    <line x1="1012" y1="320" x2="1012" y2="194"/>
    <line x1="1012" y1="320" x2="1121" y2="257"/>
    <line x1="1012" y1="320" x2="1121" y2="383"/>
    <line x1="1012" y1="320" x2="1012" y2="446"/>
    <line x1="1012" y1="320" x2="903"  y2="383"/>
    <line x1="1012" y1="320" x2="903"  y2="257"/>
  </g>

  <!-- peer mesh ring -->
  <g stroke="url(#bamber)" stroke-width="9" stroke-linejoin="round" fill="none" filter="url(#bglow)">
    <polygon points="1012,194 1121,257 1121,383 1012,446 903,383 903,257"/>
  </g>

  <!-- replica nodes -->
  <g>
    <circle cx="1012" cy="194" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="1012" cy="194" r="8" fill="#ffd166"/>
    <circle cx="1121" cy="257" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="1121" cy="257" r="8" fill="#ffd166"/>
    <circle cx="1121" cy="383" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="1121" cy="383" r="8" fill="#ffd166"/>
    <circle cx="1012" cy="446" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="1012" cy="446" r="8" fill="#ffd166"/>
    <circle cx="903"  cy="383" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="903"  cy="383" r="8" fill="#ffd166"/>
    <circle cx="903"  cy="257" r="23" fill="#0b1420" stroke="url(#bamber)" stroke-width="9"/>
    <circle cx="903"  cy="257" r="8" fill="#ffd166"/>
  </g>

  <!-- identity authority -->
  <circle cx="1012" cy="320" r="52" fill="url(#bhub)"/>
  <circle cx="1012" cy="308" r="12" fill="#0b1420"/>
  <path d="M1005 317 L999 348 H1025 L1019 317 Z" fill="#0b1420"/>

  <text x="1012" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#7e97b0" text-anchor="middle">scales to N replicas</text>

  <!-- left copy -->
  <text x="88" y="186" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="5" fill="#f6a623">HELM · KUBERNETES · FREEIPA</text>

  <text x="84" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="86" font-weight="700" fill="#f3f7fb">freeipa-mesh</text>

  <text x="88" y="360" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="27" fill="#9fb3c8">High-availability FreeIPA on Kubernetes pods.</text>
  <text x="88" y="400" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="27" fill="#9fb3c8">Scale to N replicas in a full replication mesh,</text>
  <text x="88" y="440" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="27" fill="#9fb3c8">each on a routable macvlan IP, with backup/restore DR.</text>

  <!-- capability chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#ffd166">
    <rect x="88"  y="492" width="126" height="44" rx="22" fill="#f6a623" fill-opacity="0.12" stroke="#f6a623" stroke-opacity="0.45" stroke-width="2"/>
    <text x="151" y="520" text-anchor="middle">Kerberos</text>
    <rect x="228" y="492" width="100" height="44" rx="22" fill="#f6a623" fill-opacity="0.12" stroke="#f6a623" stroke-opacity="0.45" stroke-width="2"/>
    <text x="278" y="520" text-anchor="middle">LDAP</text>
    <rect x="342" y="492" width="88"  height="44" rx="22" fill="#f6a623" fill-opacity="0.12" stroke="#f6a623" stroke-opacity="0.45" stroke-width="2"/>
    <text x="386" y="520" text-anchor="middle">DNS</text>
    <rect x="444" y="492" width="112" height="44" rx="22" fill="#f6a623" fill-opacity="0.12" stroke="#f6a623" stroke-opacity="0.45" stroke-width="2"/>
    <text x="500" y="520" text-anchor="middle">PKI/CA</text>
    <rect x="570" y="492" width="70"  height="44" rx="22" fill="#ffd166" fill-opacity="0.2" stroke="#ffd166" stroke-opacity="0.6" stroke-width="2"/>
    <text x="605" y="520" text-anchor="middle">HA</text>
    <rect x="654" y="492" width="70"  height="44" rx="22" fill="#ffd166" fill-opacity="0.2" stroke="#ffd166" stroke-opacity="0.6" stroke-width="2"/>
    <text x="689" y="520" text-anchor="middle">DR</text>
  </g>

  <!-- ===== Upstream credit =================================================
       No FreeIPA logo artwork is reproduced here, deliberately. Content on
       freeipa.org is CC BY-SA 4.0, but that licence explicitly excludes
       trademarks "including the FreeIPA logomark and logotype":
       https://www.freeipa.org/page/Legal.html

       The wording below is nominative use: it names the upstream project to
       state a fact about what this software runs, which needs no permission.

       If you obtain permission from the FreeIPA project to display the
       official logomark, paste its paths into #freeipa-logo-slot below.
       The slot is positioned for a mark about 28px tall, sitting to the
       right of the credit line. It renders nothing while empty.
       ===================================================================== -->
  <line x1="88" y1="560" x2="748" y2="560" stroke="#9fb3c8" stroke-opacity="0.18" stroke-width="2"/>

  <text x="88" y="596" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="22" fill="#cdd9e5">Powered by <tspan font-weight="700" fill="#f6a623">FreeIPA</tspan><tspan
        font-size="13" baseline-shift="super" fill="#f6a623">®</tspan><tspan
        fill="#7e97b0"> · freeipa.org</tspan></text>

  <g id="freeipa-logo-slot" transform="translate(392,572)"></g>

  <text x="88" y="622" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="14" fill="#6f879e">FreeIPA and Red Hat are trademarks of Red Hat, Inc. This project is independent and not endorsed by Red Hat.</text>
</svg>
